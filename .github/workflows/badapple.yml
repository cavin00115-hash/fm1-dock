name: badapple
on:
  workflow_dispatch:
  push:
    tags: ["ba-v*"]
jobs:
  build:
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      build: |
        test -f modules/badapple/data/badapple.bin || { echo "no modules/badapple/data/badapple.bin: upload the pack first"; exit 1; }
        ./build.sh --modules badapple --name badapple --app-name "BADAPPLE" --identity FM-1_951 \
          --pack modules/badapple/data/badapple.bin
      packages: build/badapple.fwsc
